# GitHub Actions workflow to build the Sandpiper samples
# Triggers on push and pull request events

name: Build Samples

on:
  push:
    branches: [ main, master ]
    paths:
      - 'samples/**'
      - 'SDK/**'
      - '3rdparty/**'
      - '.github/workflows/build-samples.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'samples/**'
      - 'SDK/**'
      - '3rdparty/**'
      - '.github/workflows/build-samples.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Verify compiler version is 13.3.0
        run: |
          GCC_VERSION=$(arm-linux-gnueabihf-gcc -dumpfullversion)
          echo "GCC version: $GCC_VERSION"
          if [[ ! "$GCC_VERSION" =~ ^13\.3 ]]; then
            echo "Error: Expected GCC 13.3.x but got $GCC_VERSION"
            exit 1
          fi
          arm-linux-gnueabihf-gcc --version
          arm-linux-gnueabihf-g++ --version

      - name: Build SDK first
        run: |
          cd SDK
          make clean || true
          make

      - name: Build samples
        run: |
          cd samples
          make clean || true
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samples-binaries
          path: |
            samples/*/[!M]*[!.c][!.h][!.cpp][!.md]
            !samples/**/*.c
            !samples/**/*.cpp
            !samples/**/*.h
            !samples/**/*.md
            !samples/**/*.txt
            !samples/**/*.sh
            !samples/**/Makefile
          retention-days: 30

      - name: Commit and push built binaries
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A samples
          git diff --staged --quiet || git commit -m "Auto-build: Update sample binaries [skip ci]"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree dirty before rebase. Showing status:"
            git status --porcelain
            exit 1
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin
          git rebase origin/$BRANCH || {
            echo "Rebase conflict detected — resolving with freshly built binaries..."
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            GIT_EDITOR=true git rebase --continue
          }
          git push origin HEAD:$BRANCH
